[tool.poetry]
name = "whisperx-demo"
version = "0.1.0"
description = "WhisperX demo with FastAPI and batch processing"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
  { include = "fastapi-app" },
  { include = "batch-worker" },
  { include = "batch-worker-lambda" },
]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.fastapi-app.dependencies]
fastapi = "^0.109.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
python-multipart = "^0.0.6"
pydantic = "^2.5.3"
boto3 = "^1.34.34"

[tool.poetry.group.batch-worker.dependencies]
faster-whisper = "^1.2.0"
boto3 = "^1.40.59"

[tool.poetry.group.batch-worker-lambda.dependencies]
faster-whisper = "^1.2.0"
boto3 = "^1.40.59"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["fastapi-app", "batch-worker", "batch-worker-lambda"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
